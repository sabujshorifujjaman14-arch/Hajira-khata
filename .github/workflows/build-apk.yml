
name: Build Hajira Khata APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract app project
        run: unzip -o hajira-khata-android-ready.zip -d .

      - name: Install dependencies
        working-directory: hajira-khata
        run: npm install

      - name: Build web app
        working-directory: hajira-khata
        run: npm run build

      - name: Add Android platform
        working-directory: hajira-khata
        run: npx --yes @capacitor/cli@8.0.0 add android

      - name: Sync Capacitor plugins
        working-directory: hajira-khata
        run: npx --yes @capacitor/cli@8.0.0 sync android

      - name: Build debug APK
        working-directory: hajira-khata/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hajira-Khata-APK
          path: hajira-khata/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
